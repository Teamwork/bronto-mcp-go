name: CI
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Compile
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      # Built from source with the Go version in go.mod: a prebuilt binary made
      # with an older Go cannot read the newer standard library's export data
      # and fails every file with a typecheck error. Keep the version in step
      # with GOLANGCI_LINT_VERSION in the Makefile.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-mode: goinstall

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      # The race detector covers the tools that call Bronto concurrently.
      - name: Test
        run: go test -race ./...

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build --build-arg BUILD_VERSION="${GITHUB_SHA}" -t bronto-mcp:ci .
